Name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_commit:
        description: 'SukiSU-Ultra tag/branch/commit. Leave empty for the known-good pin in config.py (DEFAULT_KSU_REF - what the latest release was built from). "main" tracks the moving branch.'
        required: false
        type: string
        default: ''
      ksu_version_code:
        description: 'Version number SukiSU reports - must match your manager. Leave empty: uses DEFAULT_KSU_VERSION_CODE from config.py when SukiSU is the default pin, otherwise GitHub''s live count.'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: 'susfs4ksu pin. Leave empty for DEFAULT_SUSFS_PINS in config.py. Bare hash (for this branch), per-branch "gki-android13-5.15=<hash>,...", or "latest" for branch HEAD.'
        required: false
        type: string
        default: ''
      custom_version:
        description: 'Custom version name (optional)'
        required: false
        type: string
        default: ''
      use_zram:
        description: 'Enable ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: 'Enable KPM'
        required: true
        type: boolean
        default: true
      use_mglru:
        description: 'Enable MGLRU (Multi-Gen LRU)'
        required: true
        type: boolean
        default: true
      use_psi:
        description: 'Enable PSI (Pressure Stall Information)'
        required: true
        type: boolean
        default: true
      use_ntsync:
        description: 'Enable NTSync (Winlator/Wine NT sync primitives)'
        required: true
        type: boolean
        default: true
      BBG:
        description: 'Enable Baseband-guard'
        required: true
        type: boolean
        default: true
      DROIDSPACES:
        description: 'Enable Droidspaces container-runtime support'
        required: true
        type: boolean
        default: true
      hide_stuff:
        description: 'Apply 69_hide_stuff.patch'
        required: true
        type: boolean
        default: true
      extra_net:
        description: 'Extra networking configs: IPv6 NAT, nftables, extra ipset types'
        required: false
        type: boolean
        default: true
      bbr_version:
        description: 'BBR congestion control version'
        required: true
        type: choice
        options:
          - none
          - bbr1
          - bbr3
        default: bbr3
      lto_mode:
        description: 'LTO mode (thin vs full)'
        required: true
        type: choice
        options:
          - thin
          - full
        default: thin
      use_cache:
        description: 'Use ccache'
        required: true
        type: boolean
        default: false
      make_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: 'Send Telegram notification'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    outputs:
      build_matrix: ${{ steps.generate.outputs.matrix }}
      kernel_version: ${{ steps.generate.outputs.kernel_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate build matrix
        id: generate
        run: python3 ${{ env.SCRIPTS_DIR }}/matrix_generator.py

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip xz-utils openssl pixz
          pip install PyYAML

      - name: Setup Neutron Clang
        run: |
          mkdir -p "$HOME/neutron-clang"
          cd "$HOME/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "NEUTRON_PATH=$HOME/neutron-clang/bin" >> $GITHUB_ENV
          echo "$HOME/neutron-clang/bin" >> $GITHUB_PATH

      - name: Inject 300Hz Timer Config
        run: |
          find . -name "gki_defconfig" -o -name "*defconfig" | while read config; do
            sed -i '/CONFIG_HZ_[0-9]\+/d' "$config"
            echo "CONFIG_HZ_300=y" >> "$config"
            echo "CONFIG_HZ=300" >> "$config"
            echo "Injected 300Hz timer into $config"
          done

      - name: Build kernel
        run: |
          cd ${{ env.SCRIPTS_DIR }}

          ARGS="--android ${{ matrix.config.android }}"
          ARGS="$ARGS --kernel ${{ matrix.config.kernel }}"
          ARGS="$ARGS --sub-level ${{ matrix.config.sub_level }}"
          ARGS="$ARGS --os-patch ${{ matrix.config.os_patch }}"
          [ -n "${{ matrix.config.revision }}" ] && ARGS="$ARGS --revision ${{ matrix.config.revision }}"
          [ -n "${{ matrix.config.kernel_tag }}" ] && ARGS="$ARGS --kernel-tag ${{ matrix.config.kernel_tag }}"
          [ "${{ matrix.config.lts }}" = "true" ] && ARGS="$ARGS --lts"
          ARGS="$ARGS --no-release"

          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_kpm }}" = "false" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.use_mglru }}" = "false" ] && ARGS="$ARGS --no-mglru"
          [ "${{ github.event.inputs.use_psi }}" = "false" ] && ARGS="$ARGS --no-psi"
          [ "${{ github.event.inputs.use_ntsync }}" = "false" ] && ARGS="$ARGS --no-ntsync"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ github.event.inputs.DROIDSPACES }}" = "true" ] && ARGS="$ARGS --droidspaces"
          [ "${{ github.event.inputs.hide_stuff }}" = "false" ] && ARGS="$ARGS --no-hide-stuff"
          [ "${{ github.event.inputs.extra_net }}" = "true" ] && ARGS="$ARGS --extra-net"

          ARGS="$ARGS --bbr-version ${{ github.event.inputs.bbr_version }}"
          ARGS="$ARGS --lto-mode ${{ github.event.inputs.lto_mode }}"

          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.ksu_version_code }}" ] || ARGS="$ARGS --ksu-version-code=${{ github.event.inputs.ksu_version_code }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version=${{ github.event.inputs.custom_version }}"

          python3 build.py $ARGS

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*AnyKernel3*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*-boot.img" -type f -exec cp {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          path: artifacts/*
          
