Name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
        default: android13
      kernel_version:
        description: 'Kernel Version'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
        default: "5.15"
      sub_level:
        description: 'Sub Level Version'
        required: true
        type: string
        default: '216'
      os_patch_level:
        description: 'OS Patch Level'
        required: true
        type: string
        default: '2026-09'
      revision:
        description: 'Android 12 Revision (optional)'
        required: false
        type: string
        default: ''
      kernel_tag:
        description: 'Kernel tag override (optional). Auto-resolved from matrix.json for this sub_level/os_patch if already listed there.'
        required: false
        type: string
        default: ''
      kernelsu_commit:
        description: 'SukiSU-Ultra tag/branch/commit.'
        required: false
        type: string
        default: ''
      ksu_version_code:
        description: 'Version number SukiSU reports.'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: 'susfs4ksu pin.'
        required: false
        type: string
        default: ''
      custom_version:
        description: 'Custom version name (optional)'
        required: false
        type: string
        default: ''
      use_zram:
        description: 'Enable ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: 'Enable KPM'
        required: true
        type: boolean
        default: true
      use_mglru:
        description: 'Enable MGLRU (Multi-Gen LRU)'
        required: true
        type: boolean
        default: true
      use_psi:
        description: 'Enable PSI (Pressure Stall Information)'
        required: true
        type: boolean
        default: true
      use_ntsync:
        description: 'Enable NTSync (Winlator/Wine NT sync primitives)'
        required: true
        type: boolean
        default: true
      BBG:
        description: 'Enable Baseband-guard'
        required: true
        type: boolean
        default: true
      DROIDSPACES:
        description: 'Enable Droidspaces container-runtime support'
        required: true
        type: boolean
        default: true
      supp_op:
        description: 'Enable OnePlus 8E support'
        required: true
        type: boolean
        default: false
      hide_stuff:
        description: 'Apply 69_hide_stuff.patch'
        required: true
        type: boolean
        default: false
      extra_net:
        description: 'Extra networking configs: IPv6 NAT, nftables, extra ipset types'
        required: false
        type: boolean
        default: true
      bbr_version:
        description: 'BBR congestion control version'
        required: true
        type: choice
        options:
          - none
          - bbr1
          - bbr3
        default: bbr3
      make_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      send_telegram:
        description: 'Send Telegram notification'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip
          pip install PyYAML

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-

      - name: Resolve kernel tag
        id: resolve-tag
        run: |
          MANUAL_TAG="${{ github.event.inputs.kernel_tag }}"
          if [ -n "$MANUAL_TAG" ]; then
            RESOLVED="$MANUAL_TAG"
            SRC="manual input"
          else
            RESOLVED=$(jq -r --arg key "${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}" \
                           --arg sub "${{ github.event.inputs.sub_level }}" \
                           --arg patch "${{ github.event.inputs.os_patch_level }}" \
              '.[$key][]? | select((.sub_level|tostring) == $sub and .os_patch_level == $patch) | .kernel_tag // empty' \
              .github/workflows/config/matrix.json 2>/dev/null | head -n1)
            SRC="matrix.json"
          

          if [ -n "$RESOLVED" ]; then
            echo "Resolved kernel_tag ($SRC): $RESOLVED"
          else
            echo "::warning::No kernel_tag resolved."
          fi
          echo "kernel_tag=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Setup Neutron Clang
        run: |
          mkdir -p "$HOME/neutron-clang"
          cd "$HOME/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          echo "NEUTRON_PATH=$HOME/neutron-clang/bin" >> $GITHUB_ENV
          echo "$HOME/neutron-clang/bin" >> $GITHUB_PATH

      - name: Inject 300Hz Timer Config
        run: |
          find . -name "gki_defconfig" -o -name "*defconfig" | while read config; do
            sed -i '/CONFIG_HZ_[0-9]\+/d' "$config"
            echo "CONFIG_HZ_300=y" >> "$config"
            echo "CONFIG_HZ=300" >> "$config"
            echo "Injected 300Hz timer into $config"
          done

      - name: Build kernel
        run: |
          cd ./.github/workflows/scripts

          ARGS="--android ${{ github.event.inputs.android_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel_version }}"
          ARGS="$ARGS --sub-level ${{ github.event.inputs.sub_level }}"
          ARGS="$ARGS --os-patch ${{ github.event.inputs.os_patch_level }}"
          [ -n "${{ github.event.inputs.revision }}" ] && ARGS="$ARGS --revision ${{ github.event.inputs.revision }}"
          [ -n "${{ steps.resolve-tag.outputs.kernel_tag }}" ] && ARGS="$ARGS --kernel-tag ${{ steps.resolve-tag.outputs.kernel_tag }}"

          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_kpm }}" = "false" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.use_mglru }}" = "false" ] && ARGS="$ARGS --no-mglru"
          [ "${{ github.event.inputs.use_psi }}" = "false" ] && ARGS="$ARGS --no-psi"
          [ "${{ github.event.inputs.use_ntsync }}" = "false" ] && ARGS="$ARGS --no-ntsync"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ github.event.inputs.DROIDSPACES }}" = "true" ] && ARGS="$ARGS --droidspaces"
          [ "${{ github.event.inputs.supp_op }}" = "true" ] && ARGS="$ARGS --op8e"
          [ "${{ github.event.inputs.hide_stuff }}" = "false" ] && ARGS="$ARGS --no-hide-stuff"
          [ "${{ github.event.inputs.extra_net }}" = "true" ] && ARGS="$ARGS --extra-net"
          ARGS="$ARGS --bbr-version ${{ github.event.inputs.bbr_version }}"
          ARGS="$ARGS --lto-mode thin"
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.ksu_version_code }}" ] || ARGS="$ARGS --ksu-version-code=${{ github.event.inputs.ksu_version_code }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version=${{ github.event.inputs.custom_version }}"
          [ "${{ github.event.inputs.make_release }}" = "true" ] || ARGS="$ARGS --no-release"

          python3 build.py $ARGS

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*AnyKernel3*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gkl-build -name "*-boot.img" -type f -exec cp {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*
          
